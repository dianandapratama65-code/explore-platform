<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset password — Explore</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<main class="token-page">
  <div class="token-card">
    <a class="brand" href="/" style="text-decoration:none;color:inherit"><span class="brandmark">✦</span> explore.</a>
    <div class="eyebrow">Pemulihan akun</div>
    <h1>Buat password baru</h1>
    <p>Masukkan password baru untuk akun kamu. Seluruh sesi yang sedang aktif akan
    dicabut setelah perubahan.</p>
    <form id="resetForm" class="auth" style="display:flex;flex-direction:column;gap:13px;margin-top:18px" novalidate>
      <label class="field"><span>Password baru</span>
        <input type="password" name="password" required minlength="8" autocomplete="new-password"
               placeholder="Minimal 8 karakter, ada huruf & angka"></label>
      <label class="field"><span>Ulangi password baru</span>
        <input type="password" name="password2" required autocomplete="new-password"
               placeholder="••••••••"></label>
      <button class="btn btn-dark btn-block" type="submit">Simpan password</button>
    </form>
    <div class="token-status" id="status"></div>
    <div class="token-actions" id="actions" hidden>
      <button class="btn btn-dark" onclick="window.location='/'">Kembali ke Explore</button>
      <button class="btn btn-light" onclick="window.location='/'" id="loginBtn">Masuk</button>
    </div>
  </div>
</main>
<script type="module">
const statusEl = document.getElementById('status');
const actionsEl = document.getElementById('actions');
const form = document.getElementById('resetForm');
const token = new URLSearchParams(location.search).get('token');

function show(kind, message) {
  statusEl.className = 'token-status ' + kind;
  statusEl.textContent = message;
  actionsEl.hidden = false;
}

if (!token) {
  show('err', 'Tautan tidak memiliki token. Minta tautan reset baru.');
  form.hidden = true;
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const body = Object.fromEntries(new FormData(form).entries());

  if (body.password !== body.password2) {
    show('err', 'Konfirmasi password tidak sama.');
    return;
  }

  try {
    const res = await fetch('/api/auth/reset-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token, password: body.password }),
    });
    const data = await res.json().catch(() => null);
    if (res.ok) {
      form.hidden = true;
      show('ok', data.message || 'Password berhasil diubah. Silakan login.');
    } else {
      show('err', data?.error?.message || 'Tautan tidak valid atau sudah kedaluwarsa.');
    }
  } catch {
    show('err', 'Tidak dapat terhubung ke server. Jalankan npm run dev lalu coba lagi.');
  }
});
</script>
</body>
</html>
